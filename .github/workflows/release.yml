name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  extract-release-notes:
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.release_notes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes
        id: notes
        continue-on-error: true
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0

  publish-to-npm:
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2

      - name: Build package
        run: pnpm run build

      - name: Publish to npm
        run: npm publish

  release-on-github:
    needs: [extract-release-notes, publish-to-npm]

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: "${{ needs.extract-release-notes.outputs.release_notes }}"
        run: |
          gh release create ${{ github.ref_name }} \
            --draft \
            --notes "${RELEASE_NOTES:-}" \
            --title "${{ github.ref_name }}" \
            --verify-tag
